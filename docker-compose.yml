# OPTIONAL: only if you want MongoDB instead of the built-in JSON storage.
#   docker compose up -d   then set MONGODB_URI=mongodb://localhost:27017 in server/.env
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - vaanimail-mongo:/data/db

volumes:
  vaanimail-mongo:
